<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darttrainer voor twee</title>
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Darttrainer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:"Bebas Neue";src:url(fonts/bebas-neue-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow";src:url(fonts/barlow-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow";src:url(fonts/barlow-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Barlow";src:url(fonts/barlow-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Barlow";src:url(fonts/barlow-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  /* Alleen de kleuren van het bord: zwart, crème (sisal), diep rood, diep groen.
     Ruimte in stappen van 8px. Telefoon eerst; groter scherm = doel links, toetsen rechts. */
  --black:#0b0b0b;
  --cream:#efe3c2;
  --red:#c8102e;
  --green:#00843d;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px; --s6:48px; --s8:64px;
  --r1:8px; --r2:16px;
  /* afgeleid van dezelfde vier kleuren */
  --surface:#151515; --surface2:#1d1d1d;
  --line:rgba(239,227,194,.12); --line2:rgba(239,227,194,.22);
  --text:var(--cream); --muted:rgba(239,227,194,.6);
  /* namen die de rest van de app gebruikt */
  --panel:var(--surface); --panel2:var(--surface2); --sisal:var(--cream); --gold:var(--cream);
  --up:var(--green); --down:var(--red);
  --p0:var(--red); --p1:var(--green); --p2:var(--cream); --p3:#8f8f8f;
  --display:"Bebas Neue","Arial Narrow",Impact,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ring:var(--green);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body,#app{margin:0;height:100%}
body{background:var(--black);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
h1,h2{font-family:var(--display);letter-spacing:.02em;line-height:1.05}
h3{font-family:var(--label);font-weight:700;font-size:24px;line-height:1.1}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px} .tab{font-variant-numeric:tabular-nums}
.kicker{font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.of{font-family:var(--label);font-size:.45em;color:var(--muted);margin-left:2px;font-weight:600;letter-spacing:.02em}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.who2{display:flex;align-items:center;gap:var(--s1);font-weight:600}
.wrap{max-width:960px;margin:0 auto;padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s2) calc(var(--s6) + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--s4)}
section{display:flex;flex-direction:column;gap:var(--s2)}
section>h2{font-size:24px;color:var(--muted)}

/* Kop */
.hero{display:flex;align-items:center;gap:var(--s2);padding-bottom:var(--s2);position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ring);border-radius:1px}
.hero .board{width:64px;height:64px;flex:none}
.hero h1{font-size:48px}
.hero h1 span{color:var(--red)}
.hero p{font-size:15px}
.hero.small{display:block}
.hero.small h1{font-size:48px;margin-top:var(--s1)}
.hero.small::after{display:none}

/* Navigatie */
.nav{display:grid;grid-template-columns:1fr 1fr;gap:var(--s1)}
.nav3{grid-template-columns:repeat(3,1fr)}
.nav button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r1);padding:var(--s1) var(--s2);min-height:48px;font:700 16px var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transition:background .15s,color .15s}
.nav button[aria-pressed=true]{background:var(--cream);border-color:var(--cream);color:var(--black)}

/* Training-knop en oefeningen */
.session{display:flex;align-items:center;gap:var(--s2);text-align:left;border:0;border-radius:var(--r2);padding:var(--s3);background:var(--red);color:var(--cream);transition:transform .12s}
.session:active{transform:scale(.99)}
.session b{display:block;font:400 32px/1 var(--display);letter-spacing:.02em}
.session span span{font-size:15px;opacity:.85}
.play-ic{width:48px;height:48px;border-radius:50%;background:var(--cream);color:var(--red);display:grid;place-items:center;font-size:18px;flex:none;padding-left:4px}
.cards{display:grid;gap:var(--s2)}
.card{display:grid;grid-template-columns:48px 1fr 24px;gap:var(--s2);align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s3) var(--s2);text-align:left;width:100%;transition:border-color .15s,background .15s}
.card:hover{border-color:var(--line2);background:var(--surface2)}
.card:active{transform:scale(.995)}
.nr{width:48px;height:48px;border-radius:var(--r1);display:grid;place-items:center;font:400 32px/1 var(--display);background:var(--black);border:1px solid var(--line2);color:var(--cream)}
.lv1 .nr{border-color:var(--green);color:var(--cream)}
.lv2 .nr{border-color:var(--cream)}
.lv3 .nr{border-color:var(--red)}
.card h3{font-size:24px}
.card p{color:var(--muted);font-size:15px;margin-top:4px}
.cbody{display:flex;flex-direction:column;gap:0;min-width:0}
.go{font-size:32px;color:var(--muted);line-height:1;text-align:center}
.best{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s1)}
.pill{display:inline-flex;align-items:center;gap:var(--s1);font-size:14px;border-radius:999px;padding:0 var(--s1);min-height:24px;background:var(--black);border:1px solid var(--line)}
.pill.ok{border-color:var(--green)}
.resume{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--green);border-radius:var(--r2);padding:var(--s2) var(--s3);background:rgba(0,132,61,.16);color:var(--cream)}
.resume b{font:700 20px var(--label);text-transform:uppercase;letter-spacing:.06em}
.resume span{font-size:15px;color:var(--muted)}

/* Weekdoel */
.goals{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s2) var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.grow{display:grid;grid-template-columns:repeat(auto-fit,minmax(144px,1fr));gap:var(--s2)}
.gitem{display:grid;grid-template-columns:1fr auto;gap:var(--s1);align-items:center}
.gitem .bar{grid-column:1/-1}
.gitem.done .tab{color:var(--cream);font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--black);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pc,var(--cream));transition:width .5s}

/* Uitklapbare blokken */
.secs{display:flex;flex-direction:column;gap:var(--s2)}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2)}
details.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:var(--s2) var(--s3);min-height:64px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary>span{display:flex;flex-direction:column;min-width:0}
details.sec>summary b{font:700 18px var(--label);text-transform:uppercase;letter-spacing:.1em}
.chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none;margin-right:var(--s1)}
details.sec[open] .chev{transform:rotate(-135deg)}
.secin{padding:0 var(--s3) var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.howto{margin:0;padding-left:var(--s3);display:flex;flex-direction:column;gap:var(--s1)}
.saygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(144px,1fr));gap:var(--s1)}
.saygrid div{background:var(--black);border:1px solid var(--line);border-radius:var(--r1);padding:var(--s1) var(--s2);display:flex;flex-direction:column}
.saygrid b{font:400 22px/1.2 var(--display);letter-spacing:.03em}
.saygrid span{font-size:13px;color:var(--muted)}
.tips{margin:0;padding-left:var(--s3);display:flex;flex-direction:column;gap:var(--s1)}
q{quotes:"“" "”"}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);flex-wrap:wrap;padding:var(--s1) 0 var(--s2);border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0;padding-bottom:0}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--black);border:1px solid var(--line);border-radius:var(--r1);padding:4px}
.seg button{background:transparent;border:0;border-radius:4px;min-height:40px;padding:0 var(--s2);font:600 15px var(--body);color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--cream);color:var(--black)}
.players{display:flex;flex-direction:column;gap:var(--s1)}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s2);align-items:center;background:var(--black);border:1px solid var(--line);border-radius:var(--r1);padding:var(--s2)}
.prow input[type=text]{background:transparent;border:0;border-bottom:1px solid var(--line2);color:var(--text);font:700 22px var(--label);padding:4px 0;min-width:0;width:100%}
.pset{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);align-items:center}
.favl{display:flex;align-items:center;gap:var(--s1);font-size:14px;color:var(--muted)}
.favl select{background:var(--surface);color:var(--text);border:1px solid var(--line2);border-radius:var(--r1);min-height:40px;padding:0 var(--s1);font:600 15px var(--body)}
.iconbtn{background:transparent;border:0;color:var(--muted);font-size:24px;min-width:40px;min-height:40px}
.ghost{background:transparent;border:1px dashed var(--line2);border-radius:var(--r1);min-height:48px;color:var(--muted)}
.primary{background:var(--red);color:var(--cream);border:0;border-radius:var(--r1);min-height:56px;padding:0 var(--s3);font:700 18px var(--label);letter-spacing:.1em;text-transform:uppercase}
.secondary{background:transparent;color:var(--cream);border:1px solid var(--line2);border-radius:var(--r1);min-height:56px;padding:0 var(--s3);font:700 18px var(--label);letter-spacing:.1em;text-transform:uppercase}
.btnrow{display:flex;flex-wrap:wrap;gap:var(--s1)}
.btnrow>*{flex:1 1 auto}
.linkbtn{background:transparent;border:1px solid var(--line2);border-radius:var(--r1);padding:4px var(--s1);color:var(--cream);font-size:14px;margin-left:var(--s1)}
.syncbox{display:flex;flex-direction:column;gap:var(--s2)}
.steps summary{cursor:pointer;font-weight:600}
.steps ol{margin:var(--s1) 0 0;padding-left:var(--s3);display:flex;flex-direction:column;gap:var(--s1);font-size:15px}
.tokin{background:var(--black);border:1px solid var(--line2);border-radius:var(--r1);color:var(--text);font:16px var(--body);min-height:48px;padding:0 var(--s2)}
.qrbox{display:flex;flex-direction:column;gap:var(--s2);align-items:flex-start}
#qr{background:#fff;border-radius:var(--r1);padding:var(--s1);width:224px;max-width:100%}
#qr svg{display:block;width:100%;height:auto}

/* Spelen — alles schaalt mee met de schermhoogte én -breedte; niets krimpt of wordt afgesneden */
.play{
  --big:clamp(48px, min(24vw, 11vh), 128px);
  --slot:clamp(36px, min(12.5vw, 6vh), 72px);
  --key:clamp(36px, 6vh, 80px);
  min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto auto auto minmax(calc(var(--key)*6 + 40px),1fr);
  grid-template-areas:"top" "score" "target" "voice" "pad";
  gap:var(--s2);max-width:1280px;margin:0 auto;
  padding:calc(var(--s2) + env(safe-area-inset-top)) var(--s2) calc(var(--s2) + env(safe-area-inset-bottom));
}
.pleft{display:contents}
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.scorebar{grid-area:score}
.target{grid-area:target}
.voice{grid-area:voice}
.pad{grid-area:pad}
.ttl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ttl .kicker{font-size:12px}
.ttl h2{font-size:clamp(24px,7vw,32px);line-height:1.05;overflow-wrap:anywhere}
.topbtns{display:flex;gap:var(--s1);align-items:center;flex:none}
.helpbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:transparent;font:600 17px var(--body);color:var(--cream)}
.stopbtn{background:transparent;border:1px solid var(--line2);border-radius:var(--r1);min-height:40px;padding:0 var(--s2);font:700 15px var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--cream)}
.scorebar{display:flex;gap:var(--s1)}
.sc{flex:1;position:relative;display:flex;justify-content:space-between;align-items:center;gap:var(--s2);min-width:0;min-height:56px;padding:var(--s1) var(--s2);
  background:linear-gradient(180deg,#181818,#121212);border:1px solid var(--line);border-radius:var(--r1);box-shadow:inset 0 1px 0 rgba(239,227,194,.05)}
.sc::after{content:"";position:absolute;left:var(--s2);right:var(--s2);bottom:-1px;height:2px;border-radius:2px;background:var(--pc);opacity:0;transition:opacity .2s}
.sc.on{border-color:var(--line2)}
.sc.on::after{opacity:1}
.sc .n{display:flex;align-items:center;gap:var(--s1);min-width:0;font:700 16px var(--label);text-transform:uppercase;letter-spacing:.08em;overflow-wrap:anywhere}
.sc .s{font:400 32px/1 var(--display);flex:none}
.target{display:flex;flex-direction:column;gap:var(--s1);padding:var(--s2) var(--s3) var(--s3);
  background:radial-gradient(120% 140% at 0% 0%,rgba(0,132,61,.10),transparent 55%),linear-gradient(180deg,#191919,#121212);
  border:1px solid var(--line);border-radius:var(--r2);box-shadow:inset 0 1px 0 rgba(239,227,194,.06),0 16px 32px -24px #000}
.target .who{display:flex;align-items:center;gap:var(--s1);font:700 13px var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.trow{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s2);flex-wrap:wrap}
.target .big{font:400 var(--big)/1 var(--display);letter-spacing:.01em;padding-top:4px}
.target .big .cur{color:var(--cream)}
.target .big .dim{color:var(--muted);opacity:.4}
.target .big .sep{color:var(--muted);opacity:.3;margin:0 .1em}
.target.stack .trow{flex-direction:column;align-items:flex-start}
.target.stack .big{font-size:calc(var(--big)*.62)}
.target .sub{font-size:14px;color:var(--muted)}
.target .prev{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:var(--s1);margin-top:4px}
.target .prev b{color:var(--cream);font-weight:600}
.slots{display:flex;gap:var(--s1);flex:none}
.slot{width:var(--slot);height:var(--slot);border-radius:var(--r1);border:1px dashed var(--line2);display:grid;place-items:center;font:400 calc(var(--slot)*.4) var(--display);letter-spacing:.02em;color:var(--muted);background:rgba(0,0,0,.35)}
.slot.next{border:1px solid var(--cream);color:var(--cream)}
.slot.hit{border:1px solid var(--green);background:var(--green);color:var(--cream)}
.slot.miss{border:1px solid var(--line);color:var(--muted)}
.slot.neutral{border:1px solid var(--line2);background:var(--surface2);color:var(--cream)}
.slot.fresh{animation:pop .28s ease-out}
.big.pop{animation:rise .3s ease-out}
.fx-hit{animation:glowHit .6s ease-out}
.fx-miss{animation:shake .3s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes rise{0%{transform:translateY(8px);opacity:.2}100%{transform:none;opacity:1}}
@keyframes glowHit{0%{box-shadow:inset 0 0 0 2px var(--green)}100%{box-shadow:inset 0 0 0 2px transparent}}
@keyframes shake{0%,100%{transform:none}30%{transform:translateX(-4px)}60%{transform:translateX(4px)}}
.voice{display:flex;align-items:center;gap:var(--s2);min-height:56px;padding:var(--s1) var(--s2) var(--s1) var(--s1);background:linear-gradient(180deg,#171717,#121212);border:1px solid var(--line);border-radius:999px}
.mic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--black);display:grid;place-items:center;flex:none;color:var(--cream)}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--red);border-color:var(--red);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,16,46,.6)}70%{box-shadow:0 0 0 12px rgba(200,16,46,0)}100%{box-shadow:0 0 0 0 rgba(200,16,46,0)}}
.vtext{flex:1;min-width:0;font-size:15px;line-height:1.35}
.vtext .heard{font-weight:700;color:var(--cream)}
.vtext .partial{color:var(--muted);font-style:italic}
.pad{display:grid;grid-template-rows:auto 1fr auto;gap:var(--s1);min-height:0}
.mods{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s1)}
.mods.two{grid-template-columns:1fr 1fr}
.nums{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:minmax(var(--key),1fr);gap:var(--s1)}
.mods .k{min-height:var(--key)}
.k{background:linear-gradient(180deg,#1a1a1a,#131313);border:1px solid var(--line);border-radius:var(--r1);font:400 clamp(22px,calc(var(--key)*.5),36px)/1 var(--display);letter-spacing:.02em;color:var(--cream);box-shadow:inset 0 1px 0 rgba(239,227,194,.05);transition:transform .06s,background .1s;-webkit-user-select:none;user-select:none}
.k:active{transform:scale(.96);background:var(--surface2)}
.k.mod[aria-pressed=true][data-m="1"]{background:var(--cream);border-color:var(--cream);color:var(--black)}
.k.mod[aria-pressed=true][data-m="2"]{background:var(--green);border-color:var(--green)}
.k.mod[aria-pressed=true][data-m="3"]{background:var(--red);border-color:var(--red)}
.k.bull{background:var(--black);border-color:var(--red)} .k.bull.g{border-color:var(--green)}
.k.miss{font:700 15px var(--label);text-transform:uppercase;letter-spacing:.14em}
.k.undo svg{width:22px;height:22px}

/* Venster onderaan */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:8;animation:fade .15s}
.sheetin{background:var(--black);border:1px solid var(--line2);border-bottom:0;border-radius:var(--r2) var(--r2) 0 0;width:100%;max-width:720px;padding:var(--s3) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--s2);max-height:88%;overflow:auto;animation:up .2s ease-out;position:relative}
.sheetin::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--ring);border-radius:var(--r2) var(--r2) 0 0}
.sheetin h2{font-size:32px}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(32px)}}
.opts{display:flex;flex-direction:column;gap:var(--s1)}
.opt{display:flex;align-items:center;gap:var(--s2);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r1);padding:var(--s2);min-height:64px}
.opt b{font:700 20px var(--label);letter-spacing:.04em}
.opt.last{border-color:var(--cream)}
.opt.danger{border-color:var(--red)}
.opt .dots{display:flex;gap:4px;width:24px;flex:none}
.pdesc{font-size:15px;color:var(--muted)}

/* Uitslag */
.result{display:grid;gap:var(--s2)}

<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ---------- hulpjes ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }
const lab = d => d.skip ? "Overgeslagen" : d.mult===0 ? "Mis" : d.seg===25 ? (d.mult===2 ? "Bull" : "25") : (["","S","D","T"][d.mult] + d.seg);

/* ---------- opslag ---------- */
const LS_KEY="darttrainer.v1", LS_GAME="darttrainer.game.v2";
const store = {
  data:{ players:[{id:uid(),name:"Tim",hand:"R",fav:20},{id:uid(),name:"Jan",hand:"R",fav:20}], phase:1, history:[], customs:[], updated:0 },
  ref:null, writing:false, pending:false,
  loadLocal(){ try{ const s=localStorage.getItem(LS_KEY); if(s){ const d=JSON.parse(s); if(d && Array.isArray(d.players)) this.data=Object.assign(this.data,d); } }catch(e){} this.rename(); },
  rename(){ // oude standaardnamen omzetten naar Tim en Jan
    const D=this.data; if(D.named) return;
    const RN={ik:"Tim",neef:"Jan"}, ids={};
    D.players.forEach(p=>{ const n=RN[String(p.name).trim().toLowerCase()]; if(n){ p.name=n; ids[p.id]=n; } });
    D.history.forEach(h=>(h.res||[]).forEach(r=>{ if(ids[r.pid]) r.name=ids[r.pid]; }));
    D.named=true; if(Object.keys(ids).length) this.save();
  },
  async connect(){
    if(!window.claude || typeof window.claude.use!=="function") return;
    try{
      const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
      if(!db||!user) return;
      const id=await user.id(); if(!id) return;
      this.ref=db.doc("data/users/"+id+"/darttrainer");
      const snap=await Promise.race([this.ref.get(), new Promise((_,r)=>setTimeout(()=>r("timeout"),10000))]);
      if(snap && snap.exists){ const d=snap.data(); if(d && (d.updated||0) > (this.data.updated||0)){ this.data=JSON.parse(JSON.stringify(d)); this.rename(); this.saveLocal(); render(); } }
      else if(this.data.updated){ this.flush(); }
    }catch(e){ this.ref=null; }
  },
  saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(this.data)); }catch(e){} },
  save(){ this.data.updated=Date.now(); this.saveLocal(); this.flush(); if(typeof sync!=="undefined") sync.schedule(); },
  async flush(){
    if(!this.ref) return;
    if(this.writing){ this.pending=true; return; }
    this.writing=true;
    try{ await this.ref.set(JSON.parse(JSON.stringify(this.data))); }catch(e){}
    this.writing=false;
    if(this.pending){ this.pending=false; this.flush(); }
  }
};

/* ---------- oefeningen ---------- */
const BOARD=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const bIdx=n=>BOARD.indexOf(n);
const bX=n=>Math.cos((90-18*bIdx(n))*Math.PI/180), bY=n=>Math.sin((90-18*bIdx(n))*Math.PI/180);
const opposite=n=>BOARD[(bIdx(n)+10)%20];
function sixLR(n){ // zes nummers links en rechts van de dubbel, links eerst zoals je naar het bord kijkt
  const i=bIdx(n), a=BOARD[(i+14)%20], b=BOARD[(i+6)%20];
  if(Math.abs(bX(a)-bX(b))<0.01) return bY(a)>=bY(b)?[a,b]:[b,a];
  return bX(a)<bX(b)?[a,b]:[b,a];
}
const val=d=> d.skip||d.mult===0 ? 0 : d.seg===25 ? (d.mult===2?50:25) : d.seg*d.mult;
const tl=(seg,mult)=> seg===25 ? (mult===2?"Bull":mult===1?"25":"Bull") : ((mult?["","S","D","T"][mult]:"")+seg);
function match(d,t){ if(d.skip||d.mult===0) return false; return d.seg===t.seg && (t.mult==null || d.mult===t.mult); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);

function threeSingles(t){ // oefening 3 beginner: deel door 3, één eraf en één erbij
  const a=Math.floor((t-3)/3), r=t-(3*a+3), n=[a,a+1,a+2];
  if(r>=1) n[2]++; if(r>=2) n[1]++;
  return n;
}
/* uitgooi-tip: kortste route die op een dubbel eindigt */
const ALLD=[]; for(let n=1;n<=20;n++){ ALLD.push({seg:n,mult:1},{seg:n,mult:2},{seg:n,mult:3}); } ALLD.push({seg:25,mult:1},{seg:25,mult:2});
const DPREF={20:0,16:1,8:2,10:3,12:4,18:5,4:6,2:7,14:8,6:9,25:12};
const setupCost=d=> d.seg===25?(d.mult===2?5:4) : d.mult===1?0 : d.mult===3?2 : 6;
const finCost=d=> (DPREF[d.seg]!==undefined?DPREF[d.seg]:10);
const _route={};
function route(n,maxD){
  maxD=maxD||3; const key=n+"/"+maxD; if(key in _route) return _route[key];
  let best=null, bc=1e9;
  const dbl=ALLD.filter(d=>d.mult===2);
  const consider=(arr,c)=>{ if(c<bc || (c===bc && best && val(arr[0])>val(best[0]))){ bc=c; best=arr; } };
  for(const f of dbl) if(val(f)===n) consider([f],100+finCost(f));
  if(!best && maxD>=2) for(const a of ALLD) for(const f of dbl) if(val(a)+val(f)===n) consider([a,f],200+setupCost(a)+finCost(f));
  if(!best && maxD>=3) for(const a of ALLD) for(const b of ALLD) for(const f of dbl) if(val(a)+val(b)+val(f)===n) consider([a,b,f],300+setupCost(a)+setupCost(b)+finCost(f));
  return _route[key] = best ? best.map(d=>tl(d.seg,d.mult)).join(" ") : "";
}

/* een oefening waarbij elke treffer op het doel telt */
function series(o){
  return Object.assign({
    init:()=>({score:0,tp:0}),
    step(g,s,d){ const t=this.tgt(g,s,s.turns.length,s.cur.length); const ok=match(d,t); if(ok && t.counts!==false){ s.score++; s.tp++; } return ok; },
    endTurn(g,s){ const t=s.tp; s.tp=0; return "+"+t; },
    done(g,s){ return s.turns.length>=this.T(g); },
    head(g,s){ const ti=s.turns.length, di=s.cur.length, t=[0,1,2].map(i=>this.tgt(g,s,ti,i));
      const same=t.every(x=>x.label===t[0].label);
      return same ? {big:t[0].label, sub:this.sub(g,s,ti)} : {seq:t.map(x=>x.label), cur:di, sub:this.sub(g,s,ti)}; },

function parseTargets(txt){
  const out=[];
  for(const raw of String(txt).toUpperCase().split(/[\s,;]+/)){
    if(!raw) continue;
    if(raw==="B"||raw==="BULL"){ out.push({seg:25,mult:null}); continue; }
    const m=raw.match(/^([SDT]?)(\d{1,2})$/); if(!m) continue;
    const n=+m[2];
    if(n===25){ out.push({seg:25,mult:m[1]==="D"?2:1}); continue; }
    if(n===50){ out.push({seg:25,mult:2}); continue; }
    if(n<1||n>20) continue;
    out.push({seg:n,mult:m[1]?({S:1,D:2,T:3}[m[1]]):null});
  }
  return out;
}

}

/* Speelt alle pijlen opnieuw af: zo klopt de stand altijd, ook na "terug". */
function derive(g){
  const ex=getEx(g.ex);
  const S=g.players.map(pid=>{ const p=playerById(pid); const s=ex.init(g,p); s.p=p; s.turns=[]; s.meta=[]; s.cur=[]; return s; });
  const P=S.length; let cp=0, last=null, lastTurn=null;
  const nextP=from=>{ for(let k=1;k<=P;k++){ const i=(from+k)%P; if(!ex.done(g,S[i])) return i; } return -1; };
  for(const d of g.darts){
    if(cp<0) break;
    const s=S[cp], ok=ex.step(g,s,d);
    s.cur.push({d,ok}); last={pi:cp,ok};
    if(ex.done(g,s) || s.cur.length>=3 || (ex.turnEnd && ex.turnEnd(g,s))){
      const ds=s.cur, meta=ex.endTurn ? ex.endTurn(g,s,ds) : null;
      s.turns.push(ds); s.meta.push(meta); s.cur=[];
      lastTurn={pi:cp,ds,meta};
      cp=nextP(cp);
    }
  }
  const scores=S.map(s=> ex.scoreOf ? ex.scoreOf(g,s) : s.score);
  return {ex,S,P,cp,done:cp<0,scores,max:ex.max(g),last,lastTurn};
}

}

function turnCall(st){
  if(st.done) return "";
  const s=st.S[st.cp], h=st.ex.head(game,s), name=st.P>1||st.S.length>1 ? s.p.name+", " : "";
  if(st.ex.checkout) return name+h.big+" uit.";
  if(game.ex==="gem") return name+"zo hoog mogelijk.";
  if(game.ex==="focus") return name+(s.score? "verder op "+spk(h.big) : "begin op 1")+".";
  if(h.leg) return name+"nog "+h.big+".";
  return name+(h.seq ? h.seq.map(spk).join(", ") : spk(h.big))+".";
}

function sayMeta(meta){
  if(!meta) return "";
  let t=String(meta).replace(/\(.*?\)/g,"").replace(/^\d+:\s*/,"").replace("!","").trim();
  const m=t.match(/^\+(\d+)/); if(m) return +m[1]===0 ? "Niets raak." : m[1]+" raak.";
  if(/gegooid$/.test(t)) return t.replace(" gegooid","")+".";
  return t+".";

let lastFx=null;
function addDart(d){
  if(!game) return;
  if(isMatch(game)) return addMatchEvent({t:"dart",d});
  voice.used();
  if(derive(game).done) return;
  game.darts.push(d);
  const st=derive(game);
  const good = st.last && st.last.ok!==false && (st.last.ok===true || val(d)>0);
  if(!d.skip){ beep(good); lastFx = st.last && st.last.ok===true ? "hit" : st.last && st.last.ok===false ? "miss" : "neutral"; }
  saveGame();
  if(st.done) return finish();
  const L=st.lastTurn;
  if(L && L.ds.length && L.ds[L.ds.length-1].d===d){
    // beurt voorbij: uitslag + wie nu gooit
    if(game.ex==="gem" && /^180 /.test(L.meta||"")) speaker.say([...scoreCall(180,"nl"),{t:turnCall(st)}]);
    else speaker.say(sayMeta(L.meta)+" "+turnCall(st));
  }
  render();
}
function undo(){
  if(isMatch(game)) return undoMatch();
  if(!game||!game.darts.length) return;
  const wasDone=derive(game).done;
  const d=game.darts.pop();
  if(wasDone && game.saved){ (store.data.removed ||= []).push(game.saved); store.data.history=store.data.history.filter(h=>h.id!==game.saved); if(game.session) game.session.done=game.session.done.filter(x=>x.id!==game.saved); game.saved=null; store.save(); }
  stopCountdown(); screen="play"; saveGame(); render(); toast((d.skip?"Overslaan":lab(d))+" weggehaald");
  speaker.say("Terug. "+lab(d)+" gewist.");
}
function weekCount(pid){ const w=weekStart(Date.now()); return store.data.history.filter(h=>!h.match && h.at>=w && h.res.some(r=>r.pid===pid)).length; }
function finish(){
  const st=derive(game), ex=st.ex;
  const prevBest=game.players.map(pid=>bestFor(game.ex,pid));
  const prevWeek=game.players.map(pid=>weekCount(pid));
  const entry={id:uid(), ex:game.ex, name:ex.name, at:Date.now(), max:st.max, darts:0,
    res:game.players.map((pid,k)=>{ const s=st.S[k], r={pid, name:playerById(pid).name, score:st.scores[k], darts:s.turns.reduce((a,t)=>a+t.filter(x=>!x.d.skip).length,0)}; if(ex.extra) r.extra=ex.extra(s); if(ex.fav) r.fav=s.p.fav||20; return r; })};
  entry.darts=Math.max(...entry.res.map(r=>r.darts));
  store.data.history.unshift(entry); store.data.history=store.data.history.slice(0,CAP);
  game.saved=entry.id;
  if(game.session){ game.session.done.push({ex:game.ex, id:entry.id}); entry.session={sid:game.session.sid||"s"+game.started, ph:game.session.ph}; }
  store.save(); saveGame();
  game.records=entry.res.filter((r,k)=>prevBest[k]!==null && r.score>prevBest[k]).map(r=>r.pid);
  const goal=store.data.weekGoal||0;
  game.goals = goal ? game.players.filter((pid,k)=>prevWeek[k]<goal && prevWeek[k]+1>=goal) : [];

function beep(hit,big){
  if(!store.data.sound && store.data.sound!==undefined) return;
  try{
    audio = audio || new (window.AudioContext||window.webkitAudioContext)();
    const o=audio.createOscillator(), g=audio.createGain();

    g.gain.setValueAtTime(.0001,audio.currentTime); g.gain.exponentialRampToValueAtTime(.18,audio.currentTime+.01); g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+(big?.5:.16));

}

const NUMW={nul:0,een:1,"één":1,"eén":1,eentje:1,twee:2,drie:3,vier:4,vijf:5,zes:6,zeven:7,acht:8,negen:9,tien:10,elf:11,twaalf:12,dertien:13,veertien:14,vijftien:15,zestien:16,zeventien:17,achttien:18,achtien:18,negentien:19,twintig:20,vijfentwintig:25,vijftig:50,

  single:1,singel:1,singles:1,enkel:1,enkele:1,s:1,es:1};
const BULLW=new Set(["bull","bulls","bullseye","roos","bulletje","bul","bol","boel"]);
const GREENW=new Set(["groene","groen","outer","buitenste"]), REDW=new Set(["rode","rood","inner","binnenste"]);
const MISSW=new Set(["mis","miss","misser","naast","out","buiten","niks","niets","missed"]);
const SKIPW=new Set(["overslaan","skip","oversla"]);
const UNDOW=new Set(["terug","fout","undo","wis","oeps","correctie","verkeerd","annuleer","weg","oops","back"]);
const FILLW=new Set(["en","dan","nog","op","pijl","pijltje","pijlen","de","het","ja","ok","oké","oke","okay","eh","euh","uh","um","hm","nummer","number","and","is","was","gegooid","raak","die","dat","nu","keer","een"]);

function tokenize(text){
  let s=String(text).toLowerCase().normalize("NFC");

}

  w=String(w).replace(/ë/g,"e");
  if(/^\d+$/.test(w)) return parseInt(w,10);
  if(NUMW[w]!==undefined) return NUMW[w];
  const U={een:1,"één":1,twee:2,drie:3,vier:4,vijf:5,zes:6,zeven:7,acht:8,negen:9}, T={twintig:20,dertig:30,veertig:40,vijftig:50,zestig:60,zeventig:70,tachtig:80,negentig:90};
  const sub=r=>{ if(r==="") return 0; if(NUMW[r]!==undefined && NUMW[r]<=20) return NUMW[r]; if(T[r]) return T[r];
    const m=r.match(/^(een|één|twee|drie|vier|vijf|zes|zeven|acht|negen)en(twintig|dertig|veertig|vijftig|zestig|zeventig|tachtig|negentig)$/); return m ? U[m[1]]+T[m[2]] : undefined; };

function parseSpeech(text, allowTotal){
  const tk=tokenize(text), out=[]; let mult=null, bullMod=null, known=0, unknown=0, forceTotal=false;
  for(let i=0;i<tk.length;i++){
    const w=tk[i], nx=tk[i+1];
    if(UNDOW.has(w)){ out.push({undo:true}); mult=null; known++; continue; }
    if(SKIPW.has(w)){ out.push({skip:true}); mult=null; known++; continue; }
    if(MULTW[w]!==undefined){ mult=MULTW[w]; known++; continue; }
    if(GREENW.has(w)){ bullMod=25; known++; continue; }
    if(REDW.has(w)){ bullMod=50; known++; continue; }
    if(BULLW.has(w)){ const v=bullMod || (mult===1?25:50); out.push({seg:25,mult:v===25?1:2}); mult=null; bullMod=null; known++; continue; }
    if(allowTotal && (w==="bust"||w==="buster")){ out.push({total:0}); mult=null; known++; continue; }
    if(allowTotal && /^(totaal|total|totale|totaalscore)$/.test(w)){ forceTotal=true; mult=null; known++; continue; }
    if(MISSW.has(w)){ out.push({seg:0,mult:0}); mult=null; known++; continue; }
    if(isNum(w)){
      let n=dutchNum(w);
      if(n===100){ let j=i+1; if(tk[j]==="en") j++; const nx2=tk[j]!==undefined?dutchNum(tk[j]):undefined; if(nx2!==undefined && nx2<100){ n+=nx2; i=j; } }
      if(forceTotal){ forceTotal=false; if(n>=0 && n<=180){ out.push({total:n}); known++; } else unknown++; continue; }
      if((w==="een"||w==="één"||w==="eén") && nx && (MULTW[nx]!==undefined||BULLW.has(nx)||isNum(nx)||GREENW.has(nx)||REDW.has(nx))) continue; // lidwoord

      if(n>=1&&n<=20) out.push({seg:n,mult:mult||1});
      else if(n===25) out.push({seg:25,mult:mult===2?2:1});
      else if(n===50) out.push({seg:25,mult:2});
      else if(n===0) out.push({seg:0,mult:0});
      else if(allowTotal && n>20 && n<=180 && mult===null) out.push({total:n});
      else { unknown++; continue; }
      mult=null; known++; continue;
    }
    if(FILLW.has(w) || store.data.players.some(p=>String(p.name).toLowerCase()===w) || ["gooit","eerst","begint","nodig","nog","je","hebt","score","leg","game","shot","on"].includes(w)) continue;
    unknown++;

const AGAINW=/\b(opnieuw|nog (een )?keer|nog eens|nogmaals|herbegin|again|revanche)\b/;
function stripEcho(text){
  // de microfoon kan de laatste zin van de app nog hebben opgevangen: die woorden vooraan weglaten
  if(!speaker.lastSpoken || Date.now()-(speaker.lastEnd||0) > 6000) return text;
  const own=new Set(tokenize(speaker.lastSpoken)), tk=tokenize(text);
  let i=0; while(i<tk.length && own.has(tk[i])) i++;
  return i ? tk.slice(i).join(" ") : text;

  text=String(text).trim(); if(!text) return;
  if(Date.now() < (voice.muteUntil||0)) return;   // dat was de app zelf
  text=stripEcho(text); if(!text.trim()) return;
  voice.used();
  const low=text.toLowerCase();
  if(screen==="result" && /\b(volgende|verder|door)\b/.test(low) && game && game.session){ voice.heard=text; nextInSession(); return; }
  if(screen==="result" && AGAINW.test(low)){ voice.heard=text; if(isMatch(game)){ startMatch({players:game.players.slice(),start:game.start,doubleIn:game.doubleIn,bestOf:game.bestOf,starter:(game.starter+1)%game.players.length}); } else startGame(game.ex, game.players, game.session); return; }
  if(screen==="play" && pendingOut){ const m=low.match(/\b(1|2|3|een|één|eentje|twee|drie)\b/); if(m){ const n={1:1,2:2,3:3,een:1,"één":1,eentje:1,twee:2,drie:3}[m[1]]; if(pendingOut.ns.includes(n)){ const p=pendingOut; pendingOut=null; voice.heard=text; addMatchEvent({t:"total",v:p.v,n}); return; } } if(/\b(nee|niet|terug)\b/.test(low)){ pendingOut=null; render(); return; } }
  if(screen==="play" && confirmStop){ if(/\b(ja|stop|stoppen)\b/.test(low)){ confirmStop=false; screen="home"; render(); return; } if(/\b(nee|verder|doorgaan)\b/.test(low)){ confirmStop=false; render(); return; } }
  voice.heard=text; voice.partial="";
  if(screen!=="play" && screen!=="result"){ renderVoice(); return; }
  const r=parseSpeech(text, isMatch(game));
  if(!r.actions.length){ voice.note="Niet herkend"; renderVoice(); return; }
  voice.note="";
  for(const a of r.actions){
    if(a.undo) undo();
    else if(a.skip){ if(screen==="play" && canSkip()) addDart({skip:true}); }
    else if(a.total!==undefined){ if(screen==="play") addMatchEvent({t:"total",v:a.total}); }
    else if(screen==="play") addDart({seg:a.seg,mult:a.mult});

const DAY=864e5;
function weekStart(ts){ const d=new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime(); }
function addWeeks(ws,n){ const d=new Date(ws); d.setDate(d.getDate()+7*n); return d.getTime(); }
function isoWeek(ts){ const d=new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); const w1=new Date(d.getFullYear(),0,4); return 1+Math.round(((d-w1)/DAY-3+((w1.getDay()+6)%7))/7); }
const fmt=n=> (Math.round(n*10)/10).toLocaleString("nl-BE");
const dShort=ts=> new Date(ts).toLocaleDateString("nl-BE",{day:"numeric",month:"short"});
function pColor(pid){ const i=store.data.players.findIndex(p=>p.id===pid); return "var(--p"+((i<0?0:i)%4)+")"; }
function pName(pid,fallback){ const p=store.data.players.find(x=>x.id===pid); return p?p.name:(fallback||"Speler"); }
function exName(id,fallback){ const e=getEx(id); if(!e) return fallback; const pn=exPhaseNr(id); if(!pn) return e.name; return (e.phase ? PHASE_NAME[pn.ph]+" "+pn.nr : "Elk niveau "+pn.nr)+" · "+e.name; }
function deltaHTML(d,unit){ if(Math.abs(d)<0.05) return '<span class="delta eq">= gelijk aan gem.</span>'; return '<span class="delta '+(d>0?'up':'down')+'">'+(d>0?'▲ +':'▼ −')+fmt(Math.abs(d))+(unit||'')+(d>0?' boven':' onder')+' gem.</span>'; }

function exStats(exId){
  const H=store.data.history.filter(h=>h.ex===exId).slice().sort((a,b)=>a.at-b.at);
  if(!H.length) return null;
  const max=H[H.length-1].max, pids=[];
  H.forEach(h=>h.res.forEach(r=>{ if(!pids.includes(r.pid)) pids.push(r.pid); }));
  pids.sort((a,b)=>store.data.players.findIndex(p=>p.id===a)-store.data.players.findIndex(p=>p.id===b));
  const thisW=weekStart(Date.now()), weeks=[]; for(let i=7;i>=0;i--) weeks.push(addWeeks(thisW,-i));
  const per=pids.map(pid=>{
    const rows=[]; H.forEach(h=>{ const r=h.res.find(x=>x.pid===pid); if(r) rows.push({at:h.at,score:r.score,name:r.name}); });
    const scores=rows.map(r=>r.score), avg=scores.reduce((a,b)=>a+b,0)/scores.length;
    const wk=weeks.map(w=>{ const xs=rows.filter(r=>r.at>=w && r.at<addWeeks(w,1)).map(r=>r.score); return xs.length?{avg:xs.reduce((a,b)=>a+b,0)/xs.length,n:xs.length,best:Math.max(...xs)}:null; });
    return {pid,name:pName(pid,rows[rows.length-1].name),last:rows[rows.length-1],avg,best:Math.max(...scores),n:rows.length,wk};
  });
  return {H,max,per,weeks};
}
function chartSVG(exId,S){
  const W=340,Hh=150,L=30,R=12,T=10,B=24, iw=W-L-R, ih=Hh-T-B, n=S.weeks.length;
  const x=i=>L+iw*(i+.5)/n, y=v=>T+ih*(1-v/S.max);
  const sel=tipWeek[exId]; let g='';
  [0,.5,1].forEach(f=>{ const v=Math.round(S.max*f); g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+v+'</text>'; });
  S.weeks.forEach((w,i)=>{ g+='<text x="'+x(i)+'" y="'+(Hh-6)+'" text-anchor="middle" font-size="11" fill="'+(i===sel?'var(--sisal)':'var(--muted)')+'">'+(i===n-1?'nu':'wk '+isoWeek(w))+'</text>'; });
  if(sel!==undefined) g+='<line x1="'+x(sel)+'" x2="'+x(sel)+'" y1="'+T+'" y2="'+(T+ih)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>';
  S.per.forEach((P,pi)=>{
    const c=pColor(P.pid), dash=pi%2?' stroke-dasharray="6 4"':'';
    for(let i=1;i<n;i++){ const a=P.wk[i-1], b=P.wk[i]; if(a&&b) g+='<line x1="'+x(i-1)+'" y1="'+y(a.avg)+'" x2="'+x(i)+'" y2="'+y(b.avg)+'" stroke="'+c+'" stroke-width="2" stroke-linecap="round"'+dash+'/>'; }
    P.wk.forEach((v,i)=>{ if(v) g+='<circle cx="'+x(i)+'" cy="'+y(v.avg)+'" r="'+(i===sel?5.5:4)+'" fill="'+(pi%2?'var(--black)':c)+'" stroke="'+c+'" stroke-width="2"/>'; });
    // all-time gemiddelde als stippellijn
    g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(P.avg)+'" y2="'+y(P.avg)+'" stroke="'+c+'" stroke-width="1" stroke-dasharray="2 4" opacity=".8"/>';
  });
  S.weeks.forEach((w,i)=>{ g+='<rect data-act="wk" data-ex="'+esc(exId)+'" data-w="'+i+'" x="'+(L+iw*i/n)+'" y="0" width="'+(iw/n)+'" height="'+Hh+'" fill="transparent" style="cursor:pointer"><title>Week '+isoWeek(w)+'</title></rect>'; });
  let tip='Tik op een week voor de cijfers. Stippellijn = gemiddelde van altijd.';
  if(sel!==undefined){ const w=S.weeks[sel]; tip='<b>Week '+isoWeek(w)+'</b> ('+dShort(w)+' – '+dShort(addWeeks(w,1)-DAY)+'): '+S.per.map(P=>{ const v=P.wk[sel]; return esc(P.name)+' '+(v?fmt(v.avg)+' gem., beste '+fmt(v.best)+' ('+v.n+'×)':'niet gespeeld'); }).join(' · '); }
  const legend=S.per.length>1?'<div class="legend">'+S.per.map(P=>'<span><i class="dot" style="background:'+pColor(P.pid)+'"></i>'+esc(P.name)+'</span>').join('')+'</div>':'';
  return '<div class="chart">'+legend+'<svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Gemiddelde score per week, laatste 8 weken">'+g+'</svg><div class="tip">'+tip+'</div></div>';
}

const CAP = window.claude ? 1200 : 3000;           // aantal bewaarde uitslagen
const SYNC_KEY="darttrainer.sync", SYNC_FILE="darttrainer.json";
const normName=n=>({ik:"tim",neef:"jan"}[n]||n);
function mergeData(base, inc){
  const out={players:(base.players||[]).map(p=>Object.assign({},p)), history:(base.history||[]).slice(), customs:(base.customs||[]).slice()};
  const removed=new Set([...(base.removed||[]), ...(inc.removed||[])]), map={};
  for(const p of (inc.players||[])){
    if(removed.has(p.id)) continue;
    const nm=normName(String(p.name).trim().toLowerCase());
    let m=out.players.find(x=>x.id===p.id) || out.players.find(x=>normName(String(x.name).trim().toLowerCase())===nm);
    if(m){ map[p.id]=m.id; if((p.upd||0)>(m.upd||0)){ m.name=p.name; m.hand=p.hand; m.fav=p.fav; m.upd=p.upd; } }
    else { const n=Object.assign({},p); if(n.name && RN_DEFAULT[nm]) n.name=RN_DEFAULT[nm]; out.players.push(n); map[p.id]=p.id; }
  }
  out.players=out.players.filter(p=>!removed.has(p.id));
  const have=new Set(out.history.map(h=>h.id));
  for(const h of (inc.history||[])) if(!have.has(h.id)) out.history.push(Object.assign({},h,{res:(h.res||[]).map(r=>Object.assign({},r,{pid:map[r.pid]||r.pid}))}));
  for(const c of (inc.customs||[])) if(!out.customs.some(x=>x.id===c.id)) out.customs.push(c);
  out.history=out.history.filter(h=>!removed.has(h.id)).sort((a,b)=>b.at-a.at||(a.id<b.id?-1:1)).slice(0,CAP);
  out.customs=out.customs.filter(c=>!removed.has(c.id));
  out.removed=[...removed].slice(-3000);
  return {data:out,map};
}

[170,301,501].forEach(s=>{ EX["match"+s]={phase:-2, match:true, name:"Wedstrijd "+s, avg:true, max:()=>180, howLong:"", desc:"Wedstrijd "+s+" tegen elkaar. De score is je gemiddelde per 3 pijlen."}; });
const IMPOSSIBLE=new Set([163,166,169,172,173,175,176,178,179]);
let pendingOut=null;   // totaal = uitgooien: met hoeveel pijlen?
function isMatch(g){ return g && g.type==="match"; }
function gameDone(g){ return isMatch(g) ? deriveMatch(g).done : derive(g).done; }
function deriveMatch(g){
  const P=g.players.length, need=Math.floor(g.bestOf/2)+1;
  const st={P,need,legsWon:g.players.map(()=>0),legs:[],done:false,winner:null,lastTurn:null,
    stats:g.players.map(()=>({scored:0,darts:0,f9:0,f9d:0,hi:0,c100:0,c140:0,c180:0,co:0,bestLeg:null,busts:0}))};
  let leg=null;
  const newLeg=()=>{ const k=st.legs.length, s=(g.starter+k)%P;
    leg={k,starter:s,cp:s,rem:g.players.map(()=>g.start),inn:g.players.map(()=>!g.doubleIn),cur:[],turns:[],legDarts:g.players.map(()=>0),winner:null,ts:null};
    st.legs.push(leg); };
  newLeg();
  const finishTurn=(p,scored,darts,bust,out)=>{
    const t={p,scored,darts,bust,out,list:leg.cur.slice(),remAfter:leg.rem[p],total:leg.cur.length===0};
    leg.turns.push(t); st.lastTurn=Object.assign({leg:leg.k},t);
    const S=st.stats[p], nth=leg.turns.filter(x=>x.p===p).length;
    S.scored+=scored; S.darts+=darts; leg.legDarts[p]+=darts;
    if(nth<=3){ S.f9+=scored; S.f9d+=darts; }
    if(bust) S.busts++;
    S.hi=Math.max(S.hi,scored);
    if(scored===180) S.c180++; else if(scored>=140) S.c140++; else if(scored>=100) S.c100++;
    leg.cur=[];
    if(out){
      S.co=Math.max(S.co,scored); leg.winner=p; st.legsWon[p]++;
      S.bestLeg = S.bestLeg===null ? leg.legDarts[p] : Math.min(S.bestLeg, leg.legDarts[p]);
      if(st.legsWon[p]>=need){ st.done=true; st.winner=p; } else newLeg();
      return;
    }
    leg.cp=(p+1)%P;
  };
  for(const ev of g.darts){
    if(st.done) break;
    const p=leg.cp;
    if(leg.cur.length===0) leg.ts={rem:leg.rem[p],inn:leg.inn[p]};
    if(ev.t==="total"){
      if(leg.cur.length) continue;
      const rem=leg.rem[p]; let v=ev.v;
      if(!leg.inn[p] && v>0) leg.inn[p]=true;
      const nr=rem-v;
      if(nr===0){ const n=ev.n||3; if(route(rem,n)){ leg.rem[p]=0; finishTurn(p,v,n,false,true); } else { leg.inn[p]=leg.ts.inn; finishTurn(p,0,3,true,false); } }
      else if(nr<=1){ leg.inn[p]=leg.ts.inn; finishTurn(p,0,3,true,false); }
      else { leg.rem[p]=nr; finishTurn(p,v,3,false,false); }
      continue;
    }
    // losse pijl
    const d=ev.d; let v=val(d), ok=null;
    if(!leg.inn[p]){ if(d.mult===2){ leg.inn[p]=true; ok=true; } else { v=0; ok=false; } }
    leg.cur.push({d,ok});
    if(leg.inn[p] && v>0){
      const nr=leg.rem[p]-v;
      if(nr===0 && d.mult===2){ leg.cur[leg.cur.length-1].ok=true; leg.rem[p]=0; finishTurn(p,leg.ts.rem,leg.cur.length,false,true); continue; }
      if(nr<=1){ leg.cur[leg.cur.length-1].ok=false; leg.rem[p]=leg.ts.rem; leg.inn[p]=leg.ts.inn; finishTurn(p,0,3,true,false); continue; }
      leg.rem[p]=nr;
    }

const avg3=S=> S.darts ? Math.round(30*S.scored/S.darts)/10 : 0;
function startMatch(cfg){
  stopCountdown(); confirmStop=false; playHelp=false; pendingOut=null; kbuf="";
  game={v:2,type:"match",ex:"match"+cfg.start,players:cfg.players.slice(),start:cfg.start,doubleIn:!!cfg.doubleIn,bestOf:cfg.bestOf,starter:cfg.starter,darts:[],inMode:store.data.inMode||"dart",started:Date.now()};
  store.data.matchCfg=Object.assign({},cfg); store.save();
  screen="play"; saveGame(); render(); keepAwake();
  const st=deriveMatch(game);
  { const L=callLang(), nm=playerById(game.players[st.cp]).name; speaker.say(speaker.style()==="caller" ? CALL.start(L,cfg,nm) : ["Wedstrijd "+cfg.start+", best of "+cfg.bestOf+(cfg.doubleIn?", double in":"")+". "+nm+" begint. Game on!"], {lang:L}); }
}
function callNext(st){
  if(st.done) return "";
  const L=callLang(), p=st.cp, rem=st.leg.rem[p], name=playerById(game.players[p]).name;
  if(!st.leg.inn[p]) return CALL.firstDouble(L,name);
  if(rem<=170 && route(rem,3)) return CALL.require(L,name,rem);
  return speaker.style()==="caller" ? "" : CALL.next(L,name,rem);
}
function addMatchEvent(ev){
  if(!game || !isMatch(game)) return;
  voice.used();
  const before=deriveMatch(game); if(before.done) return;
  if(ev.t==="total"){
    if(before.leg.cur.length){ toast("Gebruik totaal alleen aan het begin van een beurt."); return; }
    if(!(ev.v>=0 && ev.v<=180) || IMPOSSIBLE.has(ev.v)){ toast(ev.v+" kan niet met drie pijlen."); speaker.say(CALL.impossible(callLang()),{lang:callLang()}); return; }
    const rem=before.leg.rem[before.cp];
    if(ev.v===rem && !ev.n && rem>0){
      const ns=[1,2,3].filter(n=>route(rem,n));
      if(ns.length){ pendingOut={v:ev.v, ns}; render(); speaker.say(CALL.howMany(callLang()),{lang:callLang()}); return; }
    }
  }
  game.darts.push(ev);
  const st=deriveMatch(game);
  if(ev.t==="dart"){ const c=st.lastTurn; beep(!!(c && c.out) || val(ev.d)>0); lastFx = val(ev.d)>0 ? "hit" : "miss"; }
  saveGame();
  const turnEnded = countTurns(st)!==countTurns(before) || st.legs.length!==before.legs.length;
  if(st.done){ return finishMatch(st); }
  if(st.legs.length>before.legs.length){
    const w=st.legs[st.legs.length-2].winner, nm=i=>playerById(game.players[i]).name;
    { const L=callLang(); speaker.say([...CALL.leg(L,st.legs.length-2,nm(w)), {t:game.players.map((id,i)=>nm(i)+" "+st.legsWon[i]).join(", ")+"."}, {t:CALL.starts(L,nm(st.cp))}],{lang:L}); }
    toast("Leg voor "+nm(w)+"!");
  } else if(turnEnded){
    const t=st.lastTurn;
    { const L=callLang(); speaker.say([...(t.bust?CALL.bust(L):t.scored===0?[{t:CALL.noscore(L)}]:scoreCall(t.scored,L)), {t:callNext(st)}],{lang:L}); }
  }

}
function countTurns(st){ return st.legs.reduce((a,l)=>a+l.turns.length,0); }

  screen="play"; saveGame(); render(); toast("Laatste invoer gewist"); speaker.say(CALL.undo(callLang()),{lang:callLang()});
}

  const entry={id:uid(),ex:game.ex,name:"Wedstrijd "+game.start,at:Date.now(),max:180,darts:Math.max(...res.map(r=>r.darts)),res,

/* --- klavier: losse pijlen of een totaal --- */
let kbuf="";
function parseKeys(s, allowTotal){
  s=String(s).trim().toLowerCase(); if(!s) return null;
  const forceTotal = s.startsWith("=") || (allowTotal && game && game.inMode==="total");
  const clean=s.replace(/^=/,"");
  if(allowTotal && /^\d{1,3}$/.test(clean)){ const n=+clean; if(forceTotal || (n>20 && n!==25 && n!==50)) return {total:n}; }
  const out=[];
  for(const tok of clean.split(/[\s,;+]+/).filter(Boolean)){
    let m;
    if(/^(m|x|mis|0)$/.test(tok)) out.push({seg:0,mult:0});
    else if(/^(b|bull|bul|50|db)$/.test(tok)) out.push({seg:25,mult:2});
    else if(/^(sb|25|s25)$/.test(tok)) out.push({seg:25,mult:1});
    else if(tok==="d25") out.push({seg:25,mult:2});
    else if((m=tok.match(/^([sdt]?)(\d{1,2})$/)) && +m[2]>=1 && +m[2]<=20) out.push({seg:+m[2],mult:({s:1,d:2,t:3}[m[1]]||1)});
    else return {error:tok};
  }
  return {darts:out};
}
function commitKbuf(){
  const r=parseKeys(kbuf, isMatch(game)); const raw=kbuf; kbuf="";
  if(!r){ render(); return; }
  if(r.error){ toast("Niet begrepen: "+raw); render(); return; }
  if(r.total!==undefined) return addMatchEvent({t:"total",v:r.total});
  for(const d of r.darts) addDart(d);
  render();
}

      +'<button class="delbtn" data-act="mdel" data-ids="'+r.ids.join(",")+'" data-label="'+esc(label[r.kind]+': '+r.title+' ('+dShort(r.at)+')')+'" aria-label="Verwijder '+esc(r.title)+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button></div>').join('')
    : '<p class="muted">Niets gevonden.</p>';
  const more = all.length>manageLimit ? '<button class="secondary" data-act="mmore">Toon meer ('+(all.length-manageLimit)+')</button>' : '';
  return '<p class="muted small">'+(scope==="match"?'Verwijder een wedstrijd.':'Verwijder een oefening of een volledige training.')+' Hij verdwijnt uit alle statistieken, ook op gekoppelde toestellen.</p>'+seg+'<div class="mlist">'+list+'</div>'+more;
}
function deleteSheetHTML(){
  if(!pendingDel) return '';
  return '<div class="sheet" role="dialog" aria-modal="true" aria-label="Verwijderen?"><div class="sheetin"><h2>Verwijderen?</h2><p>'+esc(pendingDel.label)+'</p><p class="muted small">'+(pendingDel.ids.length>1?pendingDel.ids.length+' resultaten worden':'Dit resultaat wordt')+' uit alle statistieken gehaald. Dit kan niet ongedaan worden.</p><div class="btnrow"><button class="primary" data-act="mdelok">Verwijderen</button><button class="secondary" data-act="mdelx">Annuleren</button></div></div></div>';
}
function deleteEntries(ids){
  const set=new Set(ids), D=store.data;
  (D.removed ||= []).push(...ids);
  D.history=D.history.filter(h=>!set.has(h.id));
  if(game && game.saved && set.has(game.saved)) game.saved=null;
  store.save(); toast(ids.length>1?ids.length+" resultaten verwijderd":"Resultaat verwijderd");
}

/* ---------- klikken ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, D=store.data;
  speaker.unlock();
  if(audio && audio.state==="suspended") audio.resume();
  switch(a){
    case "mic": voice.toggle(); break;
    case "tab": tab=b.dataset.t; render(); window.scrollTo(0,0); break;
    case "wk": tipWeek[b.dataset.ex]=+b.dataset.w; render(); break;
    case "bcopy": { const txt=JSON.stringify(shareable(D)); try{ navigator.clipboard.writeText(txt).then(()=>toast("Back-up gekopieerd. Plak hem op de andere gsm."),()=>{ $("#bk").value=txt; toast("Kopiëren lukte niet: selecteer de tekst in het vak."); }); }catch(err){ $("#bk").value=txt; } break; }
    case "bmerge": mergeBackup($("#bk").value); break;
    case "start": if(store.data.players.length===1){ voice.autoOn(); startGame(b.dataset.ex,[store.data.players[0].id]); } else { pickEx=b.dataset.ex; render(); } break;
    case "resume": voice.autoOn(); screen="play"; render(); keepAwake(); break;
    case "home":
      if(screen==="result"){ quit(); }
      else if(screen==="play" && game && game.darts.some(d=>!d.skip) && !gameDone(game)){ confirmStop=true; render(); }
      else if(screen==="play"){ quit(); }
      else { screen="home"; render(); } break;
    case "cs-go": confirmStop=false; render(); break;
    case "cs-pause": confirmStop=false; speaker.cancel(); screen="home"; render(); releaseAwake(); break;
    case "cs-quit": quit(); break;
    case "snext": nextInSession(); break;
    case "sview": statsView=b.dataset.v; manageLimit=25; render(); window.scrollTo(0,0); break;
    case "h2hf": h2hFilter[b.dataset.k]=b.dataset.v; render(); break;
    case "mfilter": manageFilter=b.dataset.v; manageLimit=25; render(); break;
    case "mmore": manageLimit+=25; render(); break;
    case "mdel": pendingDel={ids:b.dataset.ids.split(","), label:b.dataset.label}; render(); break;
    case "mdelx": pendingDel=null; render(); break;
    case "mdelok": { const ids=pendingDel?pendingDel.ids:[]; pendingDel=null; if(ids.length) deleteEntries(ids); render(); break; }
    case "mset": { const c=matchDraft||{}; let v=b.dataset.v; v = v==="true"?true : v==="false"?false : +v; c[b.dataset.k]=v; D.matchCfg=c; store.save(); render(); break; }
    case "mpick": { const c=matchDraft; const id=b.dataset.id; if(c.players.includes(id)){ if(c.players.length>2) c.players=c.players.filter(x=>x!==id); } else { c.players=[...c.players.slice(-1),id]; } c.starter=0; D.matchCfg=c; store.save(); render(); break; }
    case "mstart": voice.autoOn(); startMatch(matchDraft); break;
    case "rematch": { voice.autoOn(); const c=Object.assign({},D.matchCfg||{}, {players:game.players.slice(), start:game.start, doubleIn:game.doubleIn, bestOf:game.bestOf, starter:(game.starter+1)%game.players.length}); startMatch(c); break; }
    case "imode": game.inMode=b.dataset.v; D.inMode=b.dataset.v; store.save(); kbuf=""; saveGame(); render(); break;
    case "qt": addMatchEvent({t:"total",v:+b.dataset.v}); break;
    case "td": if(kbuf.length<3){ kbuf+=b.dataset.v; } render(); break;
    case "tback": if(kbuf) kbuf=kbuf.slice(0,-1); else undo(); render(); break;
    case "tok": if(kbuf){ const v=+kbuf; kbuf=""; addMatchEvent({t:"total",v}); } break;
    case "outn": { const p=pendingOut; pendingOut=null; if(p) addMatchEvent({t:"total",v:p.v,n:+b.dataset.v}); break; }
    case "outx": pendingOut=null; render(); break;
    case "session": pickEx="__session"; render(); break;
    case "speak": D.speak = b.dataset.v==="1"; store.save(); render(); break;
    case "vstyle": D.voiceStyle=b.dataset.v; store.save(); render(); if(D.voiceStyle!=="off") speaker.say(D.voiceStyle==="caller" ? scoreCall(180,callLang()) : ["Stem staat aan."],{lang:callLang()}); break;
    case "clang": D.callLang=b.dataset.v; store.save(); render(); speaker.say(CALL.start(callLang(),{},"Tim"),{lang:callLang()}); break;
    case "mds": D.micDuringSpeech=b.dataset.v; store.save(); render(); break;
    case "vtest": { const L=callLang(); speaker.lastStart=0; speaker.lastError=""; speaker.say([...scoreCall(180,L),{t:CALL.require(L,"Jan",81)}],{lang:L});
      setTimeout(()=>{ const n=speaker.voices("nl").length, e=speaker.voices("en").length, el=$("#vdiag");
        const okk=speaker.lastStart>0;
        if(el) el.innerHTML = okk ? '<span style="color:var(--green)">●</span> De stem werkt. Hoor je niets? Kijk of je iPhone niet op stil staat (schakelaar aan de zijkant) en zet het volume hoger.'
          : '<span style="color:var(--red)">●</span> De stem start niet'+(speaker.lastError?' ('+esc(speaker.lastError)+')':'')+'. '+n+' Nederlandse en '+e+' Engelse stemmen gevonden. Zet de stille modus uit, open de app via je eigen link in Safari (niet in de Claude-app) en tik nog eens.'; },1500);
      break; }
    case "goal": D.weekGoal = +b.dataset.v; store.save(); render(); break;
    case "again": { voice.autoOn(); if(isMatch(game)){ const c={players:game.players.slice(),start:game.start,doubleIn:game.doubleIn,bestOf:game.bestOf,starter:(game.starter+1)%game.players.length}; startMatch(c); } else startGame(game.ex, game.players, game.session); break; }
    case "num": addDart({seg:+b.dataset.n, mult:modSel}); modSel=1; if(screen==="play") render(); break;
    case "mod": modSel = (modSel===+b.dataset.m && modSel!==1) ? 1 : +b.dataset.m; render(); break;
    case "miss": addDart({seg:0,mult:0}); modSel=1; if(screen==="play") render(); break;
    case "b25": addDart({seg:25,mult:modSel===2?2:1}); modSel=1; if(screen==="play") render(); break;
    case "b50": addDart({seg:25,mult:2}); modSel=1; if(screen==="play") render(); break;
    case "undo": undo(); break;
    case "skip": if(canSkip()) addDart({skip:true}); break;
    case "phase": D.phase=+b.dataset.p; store.save(); render(); break;
    case "sconnect": { const v=($("#gtok")||{}).value||""; if(v.trim().length<20){ toast("Plak eerst je GitHub-sleutel."); break; } sync.connect(v); break; }
    case "snow": sync.run(true); break;
    case "soff": sync.cfg=null; sync.saveCfg(); qrShown=false; sync.status=""; renderSync(); toast("Ontkoppeld. Je scores blijven op dit toestel."); break;
    case "slink": qrShown=!qrShown; renderSync(); break;
    case "scopy": { const l=sync.link(); try{ navigator.clipboard.writeText(l).then(()=>toast("Link gekopieerd"),()=>toast("Kopiëren lukte niet")); }catch(err){ toast("Kopiëren lukte niet"); } break; }
    case "sshare": try{ navigator.share({title:"Darttrainer koppelen",text:"Open deze link om de Darttrainer te koppelen:",url:sync.link()}).catch(()=>{}); }catch(err){} break;
    case "go": voice.autoOn(); if(pickEx==="__session") startSession(store.data.phase||1, b.dataset.ids.split(",")); else startGame(pickEx, b.dataset.ids.split(",")); break;
    case "pickclose": pickEx=null; render(); break;
    case "hand": { const p=D.players.find(x=>x.id===b.dataset.id); p.hand=b.dataset.h; p.upd=Date.now(); store.save(); render(); break; }
    case "pdel": if(D.players.length>1){ (D.removed ||= []).push(b.dataset.id); D.players=D.players.filter(x=>x.id!==b.dataset.id); store.save(); render(); } else toast("Er moet minstens één speler blijven."); break;
    case "padd": D.players.push({id:uid(),name:"Speler "+(D.players.length+1),hand:"R",fav:20,upd:Date.now()}); store.save(); render(); break;
    case "cdel": (D.removed ||= []).push(b.dataset.id); D.customs=D.customs.filter(c=>c.id!==b.dataset.id); store.save(); render(); break;
    case "phelp": playHelp=!playHelp; render(); break;
    case "autov": D.autoVoice = b.dataset.v==="1"; store.save(); render(); break;
    case "sound": D.sound = b.dataset.v==="1"; store.save(); render(); break;
    case "lang": D.lang=b.dataset.v; store.save(); if(voice.rec) voice.rec.lang=D.lang; render(); break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches('select.vsel')){ if(t.dataset.lang==="en") store.data.voiceEn=t.value; else store.data.voiceNl=t.value; store.save(); const L=t.dataset.lang; speaker.say([...scoreCall(180,L)],{lang:L}); return; }
  if(t.matches('select.msel')){ const c=matchDraft, k=+t.dataset.k; c.players[k]=t.value; c.starter=0; store.data.matchCfg=c; store.save(); render(); return; }
  if(t.matches('select.fav')){ const p=store.data.players.find(x=>x.id===t.dataset.id); if(p){ p.fav=+t.value; p.upd=Date.now(); store.save(); render(); } return; }
  if(t.matches('.prow input[type=text]')){ const p=store.data.players.find(x=>x.id===t.dataset.id); if(p){ p.name=t.value.trim()||p.name; p.upd=Date.now(); store.save(); render(); } }
});
document.addEventListener("keydown",e=>{
  if(e.target.matches && e.target.matches("input,textarea,select")) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(screen==="result" && e.key==="Enter" && !kbuf){ const p=document.querySelector(".btnrow .primary"); if(p){ e.preventDefault(); p.click(); } return; }
  if(screen!=="play" || !game) return;
  if(pendingOut && /^[123]$/.test(e.key)){ e.preventDefault(); const p=pendingOut; pendingOut=null; return addMatchEvent({t:"total",v:p.v,n:+e.key}); }
  if(confirmStop){ if(e.key==="Escape"){ confirmStop=false; render(); } return; }
  const k=e.key;
  if(k==="Enter"){ e.preventDefault(); if(kbuf) commitKbuf(); return; }
  if(k==="Backspace"){ e.preventDefault(); if(kbuf){ kbuf=kbuf.slice(0,-1); render(); } else undo(); return; }
  if(k==="Escape"){ kbuf=""; render(); return; }
  if(k.length===1 && /[0-9a-zA-Z=,+ ]/.test(k)){ if(k===" " && !kbuf) return; e.preventDefault(); if(kbuf.length<40){ kbuf+=k; render(); } }
});

/* ---------- start ---------- */
store.loadLocal();
game=loadGame();
sync.load();
const justLinked=sync.fromHash();
if(!window.claude && location.protocol==="https:" && "serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){} }
render();
voice.init();
store.connect();
if(sync.on()) sync.run().then(()=>{ if(justLinked) toast("Gekoppeld! Je ziet nu dezelfde scores als op je andere toestellen."); });
</script>
